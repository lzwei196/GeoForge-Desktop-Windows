# This repository publishes Windows artifacts only. Historical releases are
# migrated byte-for-byte; this workflow is for a new, explicitly tagged build.
name: Windows desktop release

on:
  push:
    tags: ["v*", "windows-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: New version tag to build (must already exist; no existing release)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows-release.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
